apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier-api
  namespace: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classifier-api
  template:
    metadata:
      labels:
        app: classifier-api
    spec:
      containers:
        - name: classifier-api
          image: 838054321169.dkr.ecr.eu-west-1.amazonaws.com/classifier-api:latest
          ports:
            - containerPort: 5050
          env:
            - name: CLASSIFIER_MODE
              value: "lite"
            - name: PORT
              value: "5050"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: classifier-api
  namespace: dispatcher
  labels:
    app: classifier-api
spec:
  selector:
    app: classifier-api
  ports:
    - name: http
      port: 5050
      targetPort: 5050
