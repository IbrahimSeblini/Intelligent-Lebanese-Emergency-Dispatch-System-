apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher-api
  namespace: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcher-api
  template:
    metadata:
      labels:
        app: dispatcher-api
    spec:
      containers:
        - name: dispatcher-api
          image: 838054321169.dkr.ecr.eu-west-1.amazonaws.com/dispatcher-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              value: "dispatcher.cn2eky6eu6et.eu-west-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "dispatcher"
            - name: DB_USER
              value: "dispatcher"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatcher-secrets
                  key: DB_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dispatcher-secrets
                  key: OPENAI_API_KEY
            - name: CLASSIFIER_API_URL
              value: "http://classifier-api.dispatcher.svc.cluster.local:5050"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-api
  namespace: dispatcher
  labels:
    app: dispatcher-api
spec:
  selector:
    app: dispatcher-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
