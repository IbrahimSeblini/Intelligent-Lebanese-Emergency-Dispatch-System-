apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: 838054321169.dkr.ecr.eu-west-1.amazonaws.com/dashboard:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: dispatcher
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 80
